name: Docker Hub pull-through mirror
description: Route the runner daemon's anonymous Docker Hub pulls through mirror.gcr.io.
# Shared GitHub runner IPs exhaust Docker Hub's anonymous pull limit, which failed
# whole release gates on `toomanyrequests`. The mirror needs no credential; the
# daemon falls back to docker.io on a miss, and digest-pinned images stay exact.
# This covers only the runner's own daemon, not k3s or VMs started by a journey.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        config=/etc/docker/daemon.json
        current='{}'
        if sudo test -s "$config"; then current="$(sudo cat "$config")"; fi
        jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' <<<"$current" | sudo tee "$config.next" >/dev/null
        sudo mv "$config.next" "$config"
        sudo systemctl restart docker
        for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
        docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q 'mirror.gcr.io'
